[package]
name = "shoco-dyn"
version = "0.2.0"
edition = "2021"
description = "Shoco compression for short strings, with models trained on your own text"
license = "MIT"
repository = "https://github.com/jmccrae/shoco"
readme = "README.md"
keywords = ["compression", "shoco", "short-strings", "text"]
categories = ["compression", "text-processing"]
# The training data is only used by the tests
exclude = ["training_data/", ".github/"]

[dependencies]
ordermap = "1.2"

# [[bin]]
# name = "gen_model"
# path = "src/gen_model_test.rs"
# 
# [profile.release]
# debug = true

[dev-dependencies]
# Uses the same default model as the original C implementation; used to
# check that compress produces identical output with the default model
shoco_reference = { package = "shoco", version = "=0.1.0" }
